name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Unit tests (no Docker required) ─────────────────────────────────────────
  unit:
    name: Unit tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo check
        run: cargo check

      - name: Unit tests
        run: cargo test --lib --bins

  # ── Integration tests — Linux only (testcontainers via Docker) ──────────────
  integration-docker:
    name: Integration tests (Docker) — ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Integration tests (testcontainers)
        run: cargo test --features integration-tests --test tc_flat_table --test tc_nested_fk --test tc_sibling_collapse --test tc_wide_table -- --nocapture

  # ── Integration tests — Windows (native postgres pre-installed on runner) ─────
  integration-windows:
    name: Integration tests (native PG) — windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Start PostgreSQL
        run: |
          $pgBin  = (Get-Item "C:\Program Files\PostgreSQL\*\bin"  | Select-Object -Last 1).FullName
          $pgData = (Get-Item "C:\Program Files\PostgreSQL\*\data" | Select-Object -Last 1).FullName
          & "$pgBin\pg_ctl.exe" start -D "$pgData" -l "$env:TEMP\postgres.log"
          Start-Sleep -Seconds 3
          & "$pgBin\psql.exe" -U postgres -c "ALTER USER postgres PASSWORD 'postgres';"
        shell: pwsh

      - name: Integration tests (TEST_DATABASE_URL)
        run: cargo test --test integration_pipeline --test integration_strategies --test integration_anomalies --test integration_schema --test integration_overrides --test integration_limit -- --nocapture
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # ── Integration tests — macOS (native postgres pre-installed on runner) ───────
  integration-macos:
    name: Integration tests (native PG) — macos-latest
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Start PostgreSQL
        run: |
          PG=$(brew list --formula 2>/dev/null | grep '^postgresql@' | sort -V | tail -1)
          if [ -z "$PG" ]; then
            brew install postgresql@17
            PG="postgresql@17"
          fi
          brew services start "$PG"
          sleep 5
          PG_BIN=$(brew --prefix "$PG")/bin
          "$PG_BIN/createuser" -s postgres 2>/dev/null || true
          "$PG_BIN/psql" postgres -c "ALTER USER postgres PASSWORD 'postgres';" || true

      - name: Integration tests (TEST_DATABASE_URL)
        run: cargo test --test integration_pipeline --test integration_strategies --test integration_anomalies --test integration_schema --test integration_overrides --test integration_limit -- --nocapture
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
