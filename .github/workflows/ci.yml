name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Unit tests (no Docker required) ─────────────────────────────────────────
  unit:
    name: Unit tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo check
        run: cargo check

      - name: Unit tests
        run: cargo test --lib --bins

  # ── Integration tests — Linux only (testcontainers via Docker) ──────────────
  integration-docker:
    name: Integration tests (Docker) — ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Integration tests (testcontainers)
        run: cargo test --features integration-tests --test tc_flat_table --test tc_nested_fk --test tc_sibling_collapse --test tc_wide_table -- --nocapture

  # ── Integration tests — Windows (native postgres pre-installed on runner) ─────
  integration-windows:
    name: Integration tests (native PG) — windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Start PostgreSQL service
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw "PostgreSQL service not found on runner" }
          Start-Service -Name $svc.Name
          Start-Sleep -Seconds 3
        shell: pwsh

      - name: Set postgres password
        run: |
          $pgBin = (Get-Item "C:\Program Files\PostgreSQL\*\bin" | Select-Object -Last 1).FullName
          & "$pgBin\psql.exe" -U postgres -c "ALTER USER postgres PASSWORD 'postgres';"
        shell: pwsh

      - name: Integration tests (TEST_DATABASE_URL)
        run: cargo test --test integration_pipeline --test integration_strategies --test integration_anomalies --test integration_schema --test integration_overrides --test integration_limit -- --nocapture
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # ── Integration tests — macOS (native postgres pre-installed on runner) ───────
  integration-macos:
    name: Integration tests (native PG) — macos-latest
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Start PostgreSQL
        run: |
          brew services start postgresql@14
          sleep 5
          /usr/local/opt/postgresql@14/bin/createuser -s postgres || true
          /usr/local/opt/postgresql@14/bin/psql -U postgres -c "ALTER USER postgres PASSWORD 'postgres';" || true

      - name: Integration tests (TEST_DATABASE_URL)
        run: cargo test --test integration_pipeline --test integration_strategies --test integration_anomalies --test integration_schema --test integration_overrides --test integration_limit -- --nocapture
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
