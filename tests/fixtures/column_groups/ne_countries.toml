# Natural Earth, admin-0 pays 110m (domaine public), propriétés des features : 168 colonnes.
# Étiquettes = PROPOSITION de Claude (blocs du spike #78), à corriger par l'utilisateur.
# Jeu déjà examiné pendant la conception (corrections décidées après un échec dessus) : ce n'est pas un jeu hors échantillon.

name = "ne_countries"
role = "tuning"
source = "https://naturalearth.s3.amazonaws.com/110m_cultural/ne_110m_admin_0_countries.geojson (837 ko, domaine public)"
# où sont les colonnes sous une ligne racine du fichier (GeoJSON : les propriétés de chaque Feature)
rows_path = ["properties"]
columns = [
  "featurecla", "scalerank", "LABELRANK", "SOVEREIGNT", "SOV_A3", "ADM0_DIF", "LEVEL", "TYPE",
  "TLC", "ADMIN", "ADM0_A3", "GEOU_DIF", "GEOUNIT", "GU_A3", "SU_DIF", "SUBUNIT", "SU_A3",
