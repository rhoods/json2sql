[[relation]]
name = "population et économie"
left = [
  "POP_EST", "POP_RANK", "POP_YEAR", "GDP_MD", "GDP_YEAR", "ECONOMY", "INCOME_GRP",
]

[[relation]]
name = "régions"
left = [
  "CONTINENT", "REGION_UN", "SUBREGION", "REGION_WB",
]

[[relation]]
name = "étiquettes cartographiques"
left = [
  "LABELRANK", "LABEL_X", "LABEL_Y", "MIN_LABEL", "MAX_LABEL", "MIN_ZOOM",
]

[[relation]]
name = "codes pays"
left = [
  "ISO_A2", "ISO_A3", "ISO_N3", "UN_A3", "WB_A2", "WB_A3", "FIPS_10",
]

# Échec observé : les codes pays (_IT, _FR…) reliaient FCLASS_* et NAME_* dans les mêmes groupes.
