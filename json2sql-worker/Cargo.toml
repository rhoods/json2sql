[package]
name = "json2sql-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "json2sql-worker"
path = "src/main.rs"

[dependencies]
json2sql = { path = ".." }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "fs", "time"] }

tokio-postgres = { version = "0.7", default-features = false }

urlencoding = "2"

uuid = { version = "1", features = ["v7"] }

fs2 = "0.4"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[features]
integration-tests = []
